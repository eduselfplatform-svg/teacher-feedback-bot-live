services:
  - type: worker
    name: ipe-feedback-bot
    env: python
    region: frankfurt
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python main.py"
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: CHANNEL_ID
        sync: false
      - key: ANONYMOUS_CHANNEL_ID
        sync: false
      - key: NAMED_CHANNEL_ID
        sync: false
      - key: RUN_MODE
        value: polling
      - key: PYTHON_VERSION
        value: 3.11.9
