services:
  - type: web
    name: ipe-feedback-bot
    env: python
    region: frankfurt
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: CHANNEL_ID
        sync: false
      - key: ANONYMOUS_CHANNEL_ID
        sync: false
      - key: NAMED_CHANNEL_ID
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: RUN_MODE
        value: polling
      - key: PYTHON_VERSION
        value: 3.11.9

